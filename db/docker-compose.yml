# ============================================================
# PETHOUSE · Base de datos local con Docker (PostgreSQL + PostGIS)
# ------------------------------------------------------------
# Uso:
#   docker compose up -d        → levanta la base con PostGIS
#   docker compose down         → la detiene (conserva los datos)
#
# En el PRIMER arranque ejecuta automáticamente, en orden (docker-entrypoint-initdb.d
# corre los .sql montados en orden alfabético):
#   01-esquema.sql          → estructura completa
#   02-seed.sql             → datos de ejemplo (18 hospedajes reales)
#   04-perfil-mvp-ios.sql   → columna usuarios.foto_url (editar perfil, MVP iOS)
# (03-consultas.sql NO se monta aquí a propósito: son consultas de ejemplo para correr
# manualmente, no una migración — ver db/README.md)
#
# Si ya tenías la base levantada de ANTES de que existiera 04-perfil-mvp-ios.sql, este
# archivo no se re-ejecuta solo (initdb.d solo corre en el primer arranque, con el volumen
# vacío). Aplícalo a mano una vez:
#   psql "postgres://pethouse:pethouse@localhost:5432/pethouse" -f 04-perfil-mvp-ios.sql
#
# Conexión:
#   Host: localhost  ·  Puerto: 5432
#   Usuario: pethouse  ·  Contraseña: pethouse  ·  Base: pethouse
#
# Ejemplo (psql):
#   psql "postgres://pethouse:pethouse@localhost:5432/pethouse" -c "SELECT postgis_version();"
# ============================================================
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pethouse-db
    environment:
      POSTGRES_USER: pethouse
      POSTGRES_PASSWORD: pethouse
      POSTGRES_DB: pethouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan solos en el primer arranque, en orden alfabético
      - ./01-esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./04-perfil-mvp-ios.sql:/docker-entrypoint-initdb.d/04-perfil-mvp-ios.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pethouse -d pethouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
