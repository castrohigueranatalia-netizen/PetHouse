# ============================================================
# GitHub Actions — Publica pethouse-html en GitHub Pages
# Cada vez que hagas push a "main", el sitio se actualiza solo.
# Requisito: en GitHub → Settings → Pages → Source: "GitHub Actions"
# ============================================================
name: Publicar Pethouse (HTML)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir artefacto (index.html)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
