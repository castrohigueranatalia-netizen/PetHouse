name: PetHouseiOS

options:
  bundleIdPrefix: co.pethouse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: es

settings:
  base:
    # "5" es el modo de lenguaje Swift (Language Version), no la versión del compilador —
    # el compilador Swift 5.10 sigue reportando el modo de lenguaje como "5".
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # URL base de la API leída en runtime desde Info.plist (ver Networking/APIConfig.swift).
    # Cambia este valor por configuración/xcconfig si apuntas a un backend desplegado.
    API_BASE_URL: "http://localhost:3001"

packages: {}

targets:
  PetHouseiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: DesignSystem
      - path: Core
      - path: Networking
      - path: Features
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PetHouse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          PetHouse usa tu ubicación solo mientras usas la app para mostrarte hospedajes
          de mascotas cercanos a ti en el mapa y ordenar los resultados de búsqueda por
          distancia. No se usa en segundo plano ni se comparte con terceros.
        NSPhotoLibraryAddUsageDescription: >-
          PetHouse necesita acceso para guardar imágenes que elijas al configurar tu
          perfil, tus mascotas o tu hospedaje. Solo se accede cuando tú eliges una foto.
        NSPhotoLibraryUsageDescription: >-
          PetHouse necesita acceso a tus fotos para que elijas una imagen de perfil,
          de tu mascota o de tu hospedaje. Solo se usa cuando tú lo decides.
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: "$(API_BASE_URL)"
        # Excepción de ATS solo para desarrollo local. NSAllowsLocalNetworking permite HTTP
        # sin TLS hacia cualquier IP de red local (192.168.x.x, 10.x.x.x, etc.) o dominios
        # .local — cubre tanto el Simulador (localhost) como un iPhone físico en la misma
        # red WiFi que la Mac (API_BASE_URL con la IP local de la Mac, ver PetHouseiOS/README.md).
        # En producción la API debe servirse por HTTPS y esta excepción debe retirarse.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.pethouse.app
        PRODUCT_NAME: PetHouse
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies: []

schemes:
  PetHouseiOS:
    build:
      targets:
        PetHouseiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
    archive:
      config: Release
